<!doctype html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#14532d" />
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="styles.css?v=5" />
    <title>Hutang & Bayaran · Financial Tracker</title>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar"><div><p class="eyebrow">KEWANGAN SAYA</p><h1>Hutang &amp; Bayaran</h1></div><a class="icon-button nav-home" href="index.html" aria-label="Kembali ke dashboard">⌂</a></header>
      <nav class="page-nav" aria-label="Navigasi utama"><a href="index.html">Dashboard</a><a href="tasks.html">To-Do Harian</a><a class="active" href="debts.html">Hutang &amp; Bayaran</a></nav>

      <section class="debt-summary" aria-label="Ringkasan hutang">
        <article><small>Orang berhutang dengan saya</small><strong id="receivableTotal">RM0.00</strong><span id="receivableCount">0 rekod aktif</span></article>
        <article><small>Hutang saya kepada orang</small><strong id="payableTotal">RM0.00</strong><span id="payableCount">0 rekod aktif</span></article>
      </section>

      <section class="debt-form-section">
        <div><p class="eyebrow">REKOD BARU</p><h2>Tambah hutang</h2></div>
        <form id="debtForm" class="debt-form">
          <label>Jenis rekod<select id="debtType"><option value="receivable">Orang berhutang dengan saya</option><option value="payable">Saya berhutang dengan orang</option></select></label>
          <div class="two-columns"><label>Nama orang / syarikat<input id="debtorName" required maxlength="60" placeholder="Contoh: Ahmad" /></label><label>Jumlah asal (RM)<input id="debtAmount" required type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="0.00" /></label></div>
          <div class="two-columns"><label>Tarikh<input id="debtDate" required type="date" /></label><label>Nota <input id="debtNote" maxlength="80" placeholder="Contoh: Invoice #018" /></label></div>
          <button class="save-button" type="submit">Simpan rekod hutang</button>
        </form>
      </section>

      <section class="history-section debt-history" aria-labelledby="debtListTitle">
        <div class="section-heading"><div><p class="eyebrow">SENARAI</p><h2 id="debtListTitle">Rekod hutang aktif</h2></div><span class="count" id="debtRecordCount">0 rekod</span></div>
        <div id="debtList" class="debt-list" aria-live="polite"></div>
      </section>
    </main>
    <dialog id="paymentDialog" class="transaction-dialog"><form id="paymentForm" method="dialog"><div class="dialog-heading"><div><p class="eyebrow">KEMAS KINI</p><h2 id="paymentTitle">Rekod bayaran</h2></div><button class="icon-button close-button" id="closePayment" type="button" aria-label="Tutup">×</button></div><p id="paymentHelp" class="form-help"></p><label>Jumlah bayaran (RM)<input id="paymentAmount" required type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="0.00" /></label><div class="two-columns"><label>Tarikh bayaran<input id="paymentDate" required type="date" /></label><label>Nota<input id="paymentNote" maxlength="80" placeholder="Contoh: Bayaran pertama" /></label></div><button class="save-button" type="submit">Simpan bayaran</button></form></dialog>
    <template id="emptyDebtTemplate"><div class="empty-state"><div>◎</div><h3>Belum ada rekod hutang</h3><p>Tambah rekod untuk mula menjejak bayaran.</p></div></template>
    <script src="debts.js?v=5"></script>
  </body>
</html>
